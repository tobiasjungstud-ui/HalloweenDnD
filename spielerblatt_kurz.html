<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachtfels Charakterblatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{--ink:#1d1b18;--soft:#5b564e;--line:#c9c1b2;--paper:#fffdf8;--accent:#8a5a1c}
*{box-sizing:border-box}
body{margin:0;background:#e9e5dc;color:var(--ink);font-family:'Literata',Georgia,serif;font-size:14.5px;line-height:1.45}
.leiste{max-width:210mm;margin:18px auto 0;padding:0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:14px;color:var(--soft)}
.leiste button{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:var(--paper);border-radius:6px;cursor:pointer}
.blatt{width:210mm;min-height:297mm;margin:18px auto;background:var(--paper);padding:14mm 15mm;box-shadow:0 2px 14px #0002;
  display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--farbe)}
.m{--farbe:#5d52b5}.k{--farbe:#a8582a}.h{--farbe:#3f8a74}
.oben{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.oben .spiel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
h1{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:40px;line-height:1;margin:2px 0 0;color:var(--farbe)}
.name{font-size:14px;color:var(--soft);white-space:nowrap}
.name span{display:inline-block;width:60mm;border-bottom:1px solid var(--ink);margin-left:6px}
h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:20px;margin:0 0 4px;color:var(--farbe)}
.feld{border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.feld p{margin:0 0 5px}.feld p:last-child{margin:0}
.haken{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--soft);white-space:nowrap}
.haken i{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink);vertical-align:-3px;margin-right:4px;border-radius:2px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{margin:0;padding-left:18px}
li{margin:2px 0}
.klein{font-size:12.5px;color:var(--soft)}
.boxen{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:4px}
.boxen i{aspect-ratio:1;border:1.5px solid var(--ink);border-radius:3px}
.att{width:100%;border-collapse:collapse;font-size:14px}
.att th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--line);padding:4px 6px}
.att td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.att tr:last-child td{border-bottom:0}
.att .wurf{font-weight:600;white-space:nowrap;color:var(--farbe);font-size:16px}
.att .oft{white-space:nowrap;font-size:13px;color:var(--soft)}
.att .haken{display:block;margin-top:3px}
.att .haken i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:2px;margin-right:4px}
.notiz{display:flex;flex-direction:column}
.kopfzone{display:grid;grid-template-columns:52mm 1fr;gap:10px}
.rechts{display:flex;flex-direction:column;gap:10px;min-width:0}
.portrait{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#f3eee3 0 6px,#ece5d6 6px 12px)}
.portrait.voll{background:var(--paper);border-color:var(--farbe)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait input{position:absolute;width:1px;height:1px;opacity:0}
.portrait .leer{font-family:system-ui,sans-serif;font-size:13px;color:var(--soft);text-align:center}
.portrait .weg{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;cursor:pointer}
.portrait:focus-within{outline:2px solid var(--farbe);outline-offset:2px}
.drucken{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--soft);display:flex;gap:6px;align-items:center;margin:-6mm 0 0}
.wann{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.wann.immer{color:var(--farbe);font-weight:600}
.blatt > .zwei:last-child{flex:1}
.wort{font-size:14.5px!important}
.regeln{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.regel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.regel b{display:block;font-size:22px;color:var(--farbe);font-family:'IM Fell English SC',Georgia,serif;font-weight:400}
.regel span{font-size:13px;color:var(--soft)}
.linien{flex:1;min-height:18mm;background:repeating-linear-gradient(to bottom,transparent 0 8.4mm,var(--line) 8.4mm calc(8.4mm + 1px))}
.wort{columns:2;column-gap:14px;font-size:13.5px}
.wort div{break-inside:avoid}
.wort b{font-weight:600}
@page{size:A4;margin:0}
@media print{
  body{background:none}
  .leiste,.nurschirm{display:none!important}
  .blatt.ohne{display:none}
  .portrait:not(.voll){background:none}
  .blatt{margin:0;box-shadow:none;page-break-after:always;break-after:page;width:210mm;height:297mm;min-height:0;overflow:hidden}
  .blatt:last-child{page-break-after:auto;break-after:auto}
}
@media screen and (max-width:230mm){
  .blatt{width:auto;min-height:0;margin:14px 10px;padding:18px 16px}
  .zwei,.regeln,.kopfzone{grid-template-columns:1fr}
  .portrait{max-width:70mm}
  .name span{width:40vw}
}
</style>
</head>
<body>
<div class="leiste">
  <button type="button" id="drucken">Drucken</button>
  <span>Drucken:</span>
  <button type="button" data-auswahl="alle">alle 6</button>
  <button type="button" data-auswahl="mann">nur männlich</button>
  <button type="button" data-auswahl="frau">nur weiblich</button>

</div>

const WOERTER = [["a count","ein Graf"],["to attack","angreifen"],["to roll the dice","würfeln"],["damage","Schaden"],["hit points (HP)","Lebenspunkte"],["to heal","heilen"],["a deal","eine Abmachung"],["instead of","an Stelle von"],["to promise","versprechen"],["an offer","ein Angebot"]];
const GESCHLECHT = [["mann","male"],["frau","female"]];
const kaestchen = n => Array.from({length:n}, () => "<i></i>").join("");

function blatt(f, g, gEn){
  const id = `${f.k}-${g}`;
  return `<section class="blatt ${f.k}" data-g="${g}" id="blatt-${id}">
  <label class="nurschirm drucken"><input type="checkbox" checked data-druck="${id}"> diese Seite drucken (${gEn})</label>
  <div class="oben"><div><div class="spiel">The Bride of Nachtfels · Character sheet</div><h1>${f.rolle}</h1></div><div class="name">My name:<span></span></div></div>
  <div class="kopfzone">
    <label class="portrait" data-bild="${id}" title="Bild aus ChatGPT hierher ziehen oder antippen">
      <img alt="Portrait: ${f.rolle}, ${gEn}" hidden>
      <span class="leer nurschirm">Bild hier ablegen<br><small>${gEn}</small></span>
      <input type="file" accept="image/*" data-datei="${id}">
      <button type="button" class="weg nurschirm" data-weg="${id}" hidden aria-label="Bild entfernen">×</button>
    </label>
    <div class="rechts">
      <div class="feld"><h2>You look like this</h2><p>${f.aussehen} ${f.extra[g]}</p><p>${f.wer}</p></div>
      <div class="feld"><h2>Hit points: ${f.hp}</h2><p class="klein">Cross out one box for every point of damage. At 0 you are knocked out — not dead.</p><div class="boxen">${kaestchen(f.hp)}</div></div>
    </div>
  </div>
  <div class="feld"><h2>What you can do</h2>
    <table class="att"><thead><tr><th>Name</th><th>What it does</th><th>Roll</th><th>How often</th></tr></thead><tbody>
    ${f.attacken.map(([n,w,r,o,x,wann]) => `<tr><td><b>${n}</b><span class="wann ${wann==="fight"?"":"immer"}">${wann==="fight"?"in a fight":"any time"}</span></td><td>${w}</td><td class="wurf">${r}</td><td class="oft">${o}${x?`<span class="haken">${kaestchen(x)}</span>`:""}</td></tr>`).join("")}
    </tbody></table></div>
  <div class="feld"><h2>In a fight</h2><p><b>1.</b> Say what you do — in English. <b>2.</b> Choose one thing from your list. <b>3.</b> Roll the dice and say the number. Then the enemy attacks.</p><p class="klein">Things marked <b>any time</b> also work outside a fight — for example to open a door or to get a key.</p></div>
  <div class="zwei">
    <div class="feld"><h2>Words</h2><div class="wort">${WOERTER.map(([e,d])=>`<div><b>${e}</b> — ${d}</div>`).join("")}</div></div>
    <div class="feld notiz"><h2>Notes</h2><div class="linien"></div></div>
  </div>
</section>`;
}
document.getElementById("blaetter").innerHTML = FIGUREN.map(f => GESCHLECHT.map(([g,gEn]) => blatt(f,g,gEn)).join("")).join("");

/* Bilder: im Browser gespeichert (IndexedDB). Geht das nicht, bleiben sie bis zum Neuladen. */
let DB = null;
function dbOeffnen(){ return new Promise(res => { try{ const r = indexedDB.open("nachtfels-bilder", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("bilder");
  r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); }
function dbTun(modus, f){ return new Promise(res => { if(!DB) return res(null); try{ const t = DB.transaction("bilder", modus); const q = f(t.objectStore("bilder")); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }catch(e){ res(null); } }); }
function zeigen(id, url){
  const l = document.querySelector(`[data-bild="${id}"]`), img = l.querySelector("img");
  img.hidden = !url; if(url) img.src = url; else img.removeAttribute("src");
  l.querySelector(".leer").hidden = !!url; l.querySelector(".weg").hidden = !url; l.classList.toggle("voll", !!url);
}
function laden(id, datei){
  if(!datei || !datei.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = () => { zeigen(id, r.result); dbTun("readwrite", st => st.put(r.result, id)); };
  r.readAsDataURL(datei);
}
document.addEventListener("change", e => {
  if(e.target.dataset.datei) laden(e.target.dataset.datei, e.target.files[0]);
  if(e.target.dataset.druck) document.getElementById("blatt-"+e.target.dataset.druck).classList.toggle("ohne", !e.target.checked);
