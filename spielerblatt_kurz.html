<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachtfels Spielerblatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{--ink:#1d1b18;--soft:#5b564e;--line:#c9c1b2;--paper:#fffdf8;--accent:#8a5a1c}
*{box-sizing:border-box}
body{margin:0;background:#e9e5dc;color:var(--ink);font-family:'Literata',Georgia,serif;font-size:14.5px;line-height:1.45}
.leiste{max-width:210mm;margin:18px auto 0;padding:0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:14px;color:var(--soft)}
.leiste button{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:var(--paper);border-radius:6px;cursor:pointer}
.blatt{width:210mm;min-height:297mm;margin:18px auto;background:var(--paper);padding:14mm 15mm;box-shadow:0 2px 14px #0002;
  display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--farbe)}
.m{--farbe:#5d52b5}.k{--farbe:#a8582a}.h{--farbe:#3f8a74}
.oben{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.oben .spiel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
h1{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:40px;line-height:1;margin:2px 0 0;color:var(--farbe)}
.name{font-size:14px;color:var(--soft);white-space:nowrap}
.name span{display:inline-block;width:60mm;border-bottom:1px solid var(--ink);margin-left:6px}
h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:20px;margin:0 0 4px;color:var(--farbe)}
.feld{border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.feld p{margin:0 0 5px}.feld p:last-child{margin:0}
.kraft{border:2px solid var(--farbe);background:color-mix(in srgb,var(--farbe) 6%,white)}
.kraft .kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kraft .kopf b{font-size:18px}
.haken{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--soft);white-space:nowrap}
.haken i{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink);vertical-align:-3px;margin-right:4px;border-radius:2px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{margin:0;padding-left:18px}
li{margin:2px 0}
.saetze li{font-style:italic}
.regeln{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.regel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.regel b{display:block;font-size:22px;color:var(--farbe);font-family:'IM Fell English SC',Georgia,serif;font-weight:400}
.regel span{font-size:13px;color:var(--soft)}
.linien{flex:1;min-height:40mm;background:repeating-linear-gradient(to bottom,transparent 0 8.4mm,var(--line) 8.4mm calc(8.4mm + 1px))}
.wort{columns:2;column-gap:14px;font-size:13.5px}
.wort div{break-inside:avoid}
.wort b{font-weight:600}
.fuss{font-size:11px;color:var(--soft);text-align:center}
@page{size:A4;margin:0}
@media print{
  body{background:none}
  .leiste{display:none}
  .blatt{margin:0;box-shadow:none;page-break-after:always;break-after:page;width:210mm;height:297mm;min-height:0;overflow:hidden}
  .blatt:last-child{page-break-after:auto;break-after:auto}
}
@media screen and (max-width:230mm){
  .blatt{width:auto;min-height:0;margin:14px 10px;padding:18px 16px}
  .zwei,.regeln{grid-template-columns:1fr}
  .name span{width:40vw}
}
</style>
</head>
<body>
<div class="leiste"><button onclick="window.print()">Drucken</button><span>Drei Seiten — eine pro Figur. A4, ohne Ränder. Gruppen dürfen sich eine Figur teilen.</span></div>
<div id="blaetter"></div>
<script>
const FIGUREN = [
 {k:"m", rolle:"The Arcanist", wer:[
   "You know old books, old languages and a little magic.",
   "You are clever and curious. You ask the questions that others forget."],
  kraft:"Magic Hand", was:"Move a small thing without touching it — a key, a candle, a cup, a lock. You can do it from across the room."},
 {k:"k", rolle:"The Blade", wer:[
   "You are strong and brave. You stand in front when there is danger.",
   "You do not talk much — but when you talk, people listen."],
  kraft:"Strength", was:"Lift, push, break or hold something very heavy — a door, a wall, a big man, a wolf."},
 {k:"h", rolle:"The Lightbearer", wer:[
   "You are kind and calm. You help people who are hurt or afraid.",
   "You see what other people feel — even when they don’t say it."],
  kraft:"Healing Touch", was:"Touch someone who is hurt, angry or afraid. They feel better and calm down — people and animals."}
];
const SAETZE = ["I think we should … because …","What about …?","I don’t agree. I think …","Can I try to …?","I use my special power: …","Who are you? / Why are you here?","Can you tell us more about …?"];
const WOERTER = [["a vampire hunter","Vampirjäger/in"],["a castle","ein Schloss"],["to disappear","verschwinden"],["a deal","eine Abmachung"],["instead of","an Stelle von"],["to escape","fliehen"],["an offer","ein Angebot"],["to promise","versprechen"]];
document.getElementById("blaetter").innerHTML = FIGUREN.map(f => `
<section class="blatt ${f.k}">
  <div class="oben"><div><div class="spiel">The Bride of Nachtfels · Player sheet</div><h1>${f.rolle}</h1></div><div class="name">My name:<span></span></div></div>
  <div class="feld"><h2>Who you are</h2><p>You are a <b>vampire hunter</b> — not famous, not yet. You travel with two other hunters. In a village in the mountains, a young woman is gone. You want to find out why.</p>${f.wer.map(w=>`<p>${w}</p>`).join("")}</div>
  <div class="feld kraft"><div class="kopf"><b>Special power: ${f.kraft}</b><span class="haken"><i></i>used</span></div><p>${f.was}</p><p><b>Only once</b> in the game. Say: <i>“I use my special power: …”</i> — and say what you do.</p></div>
  <div class="regeln"><div class="regel"><b>1</b><span>Speak English. Short sentences are okay.</span></div><div class="regel"><b>2</b><span>Say what you do: “I open the door.”</span></div><div class="regel"><b>3</b><span>Decide together. Everybody says one sentence.</span></div></div>
  <div class="zwei">
    <div class="feld"><h2>Useful sentences</h2><ul class="saetze">${SAETZE.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    <div class="feld"><h2>Words</h2><div class="wort">${WOERTER.map(([e,d])=>`<div><b>${e}</b> — ${d}</div>`).join("")}</div></div>
  </div>
  <div class="feld" style="flex:1;display:flex;flex-direction:column"><h2>My notes — names, clues, ideas</h2><div class="linien"></div></div>
  <div class="fuss">No dice. A good idea is better than luck.</div>
</section>`).join("");
</script>
</body>
</html>
