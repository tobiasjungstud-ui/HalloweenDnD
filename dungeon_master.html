<title>The Bride of Nachtfels</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#08080c; --crypt:#0e0e15; --stone:#14141e; --stone-hi:#1f1f2c;
  --line:#262633; --line-hi:#3a3a4c;
  --bone:#eae4d7; --ash:#948fa2; --dim:#5d5a6b;
  --gold:#d9a441; --gold-dim:#8a6a2c;
  --blood:#b23a2c; --blood-hi:#e0645a;
  --moon:#7d9bc4; --moss:#74b094;
  --display:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}

.krone{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,8,12,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px clamp(16px,2.5vw,28px)}
.krone h1{font-size:20px;line-height:1.1}
.krone .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:block}
.krone .rechts{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:6px 11px;color:var(--ash);white-space:nowrap}
.badge b{font-size:15px;font-weight:700}
.badge.g0{border-color:#2c4460;color:var(--moon)}
.badge.g1{border-color:var(--gold-dim);color:var(--gold)}
.badge.g2{border-color:var(--blood);color:var(--blood-hi)}
.krone button.klein{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:6px 11px}
.krone button.klein:hover{color:var(--bone);border-color:var(--line-hi)}

.pfad{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--crypt)}
.pfad button{flex:none;padding:9px 15px;border-right:1px solid var(--line);color:var(--dim);font-size:13px;text-align:left;min-width:120px;position:relative}
.pfad button:hover{background:var(--stone);color:var(--ash)}
.pfad button .n{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.pfad button.jetzt{background:var(--stone-hi);color:var(--bone)}
.pfad button.jetzt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold)}
.pfad button.getan .n{color:var(--moss)}
.pfad button.ent .n{color:var(--gold)}
.pfad button.kampf .n{color:var(--blood-hi)}

.raum{display:grid;grid-template-columns:minmax(0,1fr) 330px}
@media (max-width:1040px){.raum{grid-template-columns:1fr}}
.szene{padding-block:26px 60px;padding-inline:clamp(16px,3vw,38px);max-width:840px;min-width:0}
.szenenkopf{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.szenenkopf .n{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.szenenkopf h2{font-size:clamp(28px,4.4vw,42px);line-height:1.04;margin:5px 0}
.lage{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--ash)}
.lage span b{color:var(--bone);font-weight:400}
.lage span.ort b{color:var(--gold)}
.lage span.warn{color:var(--blood-hi)}
.bloecke{display:flex;flex-direction:column;gap:18px}

/* ---- Schritt-Nummerierung: jeder Block ist ein Handgriff ---- */
.schritt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start}
.schritt>.nr{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--line);width:34px;height:34px;display:grid;place-items:center;margin-top:2px}
.schritt>.kern{min-width:0}
.tat{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:7px}

/* ---- Ziel ---- */
.ziel{border:1px solid var(--line-hi);background:var(--stone);padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.ziel .label{color:var(--gold);flex:none}
.ziel p{margin:0;font-size:15.5px;flex:1;min-width:220px}
.ziel .zeit{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}

/* ---- Vorlesen ---- */
.vorlesen{border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.07),transparent 65%);padding:16px 20px}
.vorlesen .tat{color:var(--gold)}
.vorlesen p{margin:0 0 11px;font-size:18px;line-height:1.62;max-width:60ch}
.vorlesen p:last-child{margin:0}

/* ---- Sagen: ein einzelner Satz, wörtlich ---- */
.sagen{border:1px solid var(--gold-dim);background:rgba(217,164,65,.06);padding:14px 18px}
.sagen .tat{color:var(--gold)}
.sagen p{margin:0;font-size:19px;font-style:italic;line-height:1.4;max-width:58ch}
.sagen p+p{margin-top:9px}

/* ---- Personen im Raum ---- */
.personen{border:1px solid var(--line);background:var(--crypt);padding:16px 18px}
.personen .tat{color:var(--moon)}
.person{border-top:1px solid var(--line);padding:12px 0 2px}
.person:first-of-type{border-top:none;padding-top:4px}
.person .kopf{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.person h4{font-size:19px}
.person .wer{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.person .spielt{font-size:13.5px;color:var(--ash);margin:3px 0 8px}
.person ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.person li{font-size:16px;border-left:1px solid var(--line-hi);padding-left:12px;font-style:italic}
.sonst{margin:14px 0 0;font-size:13.5px;color:var(--ash);border-top:1px dotted var(--line);padding-top:10px}
.sonst b{color:var(--bone);font-weight:400}

/* ---- Wenn sie fragen ---- */
.fa{border:1px solid var(--line);background:var(--crypt);padding:16px 18px}
.fa .tat{color:var(--moon)}
.fa dl{margin:0;display:flex;flex-direction:column;gap:2px}
.fa dt{font-size:14px;color:var(--ash);font-family:var(--mono);font-size:12.5px;padding-top:10px;border-top:1px solid var(--line)}
.fa dt:first-of-type{border-top:none;padding-top:0}
.fa dd{margin:3px 0 10px;font-size:16.5px;font-style:italic;padding-left:14px;border-left:2px solid var(--gold-dim)}
.fa dd em{font-style:normal;color:var(--ash);font-size:14px;display:block;margin-top:4px;padding-left:2px}

/* ---- Tun: ein Knopf, eine Wirkung ---- */
.tun{border:1px dashed var(--line-hi);padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--crypt)}
.tun p{margin:0;flex:1;min-width:200px;font-size:15px}
.tun p b{color:var(--gold)}
.tun button{border:1px solid var(--gold);color:var(--gold);padding:10px 18px;font-size:15px;white-space:nowrap}
.tun button:hover{background:var(--gold);color:#07070b}
.tun button.getan{border-color:var(--moss);color:var(--moss)}

/* ---- Sprechaufgabe ---- */
.aufgabe{border:1px solid var(--moss);background:rgba(116,176,148,.06);padding:15px 18px}
.aufgabe .tat{color:var(--moss)}
.aufgabe p{margin:0;font-size:16.5px}
.aufgabe .blatt{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--moss);border:1px solid #3a5a4c;padding:5px 10px}

/* ---- Regie / Wortschatz ---- */
.regie{font-size:14.5px;color:var(--ash);line-height:1.6;border-left:1px solid var(--line-hi);padding-left:16px}
.regie .tat{color:var(--dim)}
.regie p{margin:0 0 8px}.regie p:last-child{margin:0}
.regie b{color:var(--bone);font-weight:400}


/* ---- Bedingte Karte ---- */
.wenn{border:1px solid var(--gold-dim);background:rgba(217,164,65,.05);padding:15px 18px}
.wenn .tat{color:var(--gold)}
.wenn h4{font-size:19px;margin-bottom:6px}
.wenn p{margin:0;font-size:16px}
.wenn p+p{margin-top:8px}
.hinweisfehlt{border:1px dashed var(--line-hi);padding:14px 18px;color:var(--ash);font-size:15px}

/* ---- Entscheidung ---- */
.optionen{display:flex;flex-direction:column;gap:12px}
.option{border:1px solid var(--line);background:var(--crypt);display:grid;grid-template-columns:48px minmax(0,1fr)}
.option:hover{border-color:var(--line-hi)}
.option.gewaehlt{border-color:var(--gold);background:rgba(217,164,65,.05)}
.option .buchstabe{border-right:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center;padding-top:15px;font-family:var(--display);font-size:25px;color:var(--dim)}
.option.gewaehlt .buchstabe{color:var(--gold);border-color:var(--gold-dim)}
.option .kern{padding:14px 18px 15px;display:flex;flex-direction:column;gap:9px;min-width:0}
.option h4{font-size:20px}
.option .was{margin:0;font-size:15.5px}
.option .bil{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.option .bil:empty{display:none}
.option .bil li{font-size:14.5px;color:var(--ash);padding-left:19px;position:relative}
.option .bil li.pro::before{content:"+";position:absolute;left:4px;color:var(--moss);font-family:var(--mono)}
.option .bil li.con::before{content:"−";position:absolute;left:4px;color:var(--blood-hi);font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-hi);padding:4px 9px;color:var(--ash)}
.chip.gefahr{border-color:var(--blood);color:var(--blood-hi)}
.chip.ruhe{border-color:#2c4460;color:var(--moon)}
.chip.wissen{border-color:#3a5a4c;color:var(--moss)}
.option .waehlen{border:1px solid var(--line-hi);padding:9px 0;font-family:var(--display);font-size:16px}
.option .waehlen:hover{background:var(--gold);color:#07070b;border-color:var(--gold)}
.option.gewaehlt .waehlen{background:rgba(217,164,65,.12);border-color:var(--gold);color:var(--gold)}

/* ---- Kampf ---- */
.kampfblock{border:1px solid var(--blood);background:rgba(178,58,44,.05);padding:15px 18px;display:flex;flex-direction:column;gap:11px}
.kampfblock .tat{color:var(--blood-hi)}
.kampfblock h4{font-size:20px}
.kampfblock>p{margin:0;font-size:15.5px}
.statblock{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px;color:var(--ash)}
.statblock b{color:var(--bone);font-weight:400}
.laden{border:1px solid var(--blood);color:var(--blood-hi);padding:10px 17px;font-size:15px;align-self:flex-start}
.laden:hover{background:var(--blood);color:var(--bone)}

/* ---- Weiter ---- */
.weiter{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:14px;align-items:baseline}
.weiter .tat{color:var(--moss);flex:none;margin:0}
.weiter p{margin:0;font-size:15.5px}
.blaettern{display:flex;justify-content:space-between;gap:14px;margin-top:30px}
.blaettern button{border:1px solid var(--line-hi);padding:13px 22px;font-family:var(--display);font-size:18px;max-width:48%;text-align:left}
.blaettern button:hover{border-color:var(--gold);color:var(--gold)}
.blaettern button:disabled{opacity:.3;cursor:not-allowed}
.blaettern button span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.blaettern .vor{text-align:right;margin-left:auto}

/* ---- Seitenleiste ---- */
.leiste{border-left:1px solid var(--line);background:var(--crypt);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);max-height:calc(100vh - 52px);overflow-y:auto}
@media (max-width:1040px){.leiste{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}}
.fach{border-bottom:1px solid var(--line);padding:15px 17px}
.fach>.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.fach>.label button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line-hi)}
.fach>.label button:hover{color:var(--gold)}
.baro{display:grid;grid-template-columns:40px 1fr;gap:13px}
.saeule{display:flex;flex-direction:column-reverse;gap:3px}
.saeule i{height:13px;background:#12121b;border:1px solid var(--line)}
.saeule i.an1{background:linear-gradient(90deg,#1f3346,#2c4d6b);border-color:#3a5f80}
.saeule i.an2{background:linear-gradient(90deg,#4a3714,var(--gold-dim));border-color:var(--gold-dim)}
.saeule i.an3{background:linear-gradient(90deg,#5e1d16,var(--blood));border-color:var(--blood)}
.barotext .zahl{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.barotext .zahl small{font-size:14px;color:var(--dim);font-weight:400}
.barotext .stufe{font-family:var(--display);font-size:17px;line-height:1.2;margin-top:3px}
.barotext .folge{font-size:12.5px;color:var(--ash);line-height:1.45;margin:6px 0 0}
.barobtn{display:flex;gap:5px;margin-top:11px}
.barobtn button{flex:1;border:1px solid var(--line);padding:7px 0;font-family:var(--mono);font-size:12px;color:var(--ash)}
.barobtn button:hover{border-color:var(--line-hi);color:var(--bone)}
.held,.gegner{border:1px solid var(--line);background:var(--stone);padding:10px 11px;display:flex;flex-direction:column;gap:7px;margin-bottom:7px}
.held.tot,.gegner.tot{opacity:.45}
.held-kopf,.g-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.held input.nm{background:none;border:none;border-bottom:1px solid var(--line);font-family:var(--display);font-size:16px;width:100%;min-width:0;padding:1px 0}
.held input.nm::placeholder{font-family:var(--body);font-size:13px;color:var(--dim)}
.held .rolle,.gegner .werte{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gegner h4{font-size:16px}
.gegner .weg{font-family:var(--mono);font-size:12px;color:var(--dim)}
.gegner .weg:hover{color:var(--blood-hi)}
.hpzeile{display:flex;align-items:center;gap:7px}
.hpwert{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;min-width:54px}
.hpwert b{font-weight:700}
.bar{flex:1;height:7px;background:#0f0f16;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .3s}
.steuer{display:flex;gap:4px}
.steuer input{width:100%;min-width:0;background:var(--crypt);border:1px solid var(--line);padding:5px 6px;font-family:var(--mono);font-size:13px;text-align:center}
.steuer button{border:1px solid var(--line);padding:5px 9px;font-family:var(--mono);font-size:12px;flex:none}
.steuer button.minus:hover{border-color:var(--blood);color:var(--blood-hi)}
.steuer button.plus:hover{border-color:var(--moss);color:var(--moss)}
.att{display:flex;gap:5px;flex-wrap:wrap}
.att button{border:1px solid var(--line-hi);padding:5px 9px;font-size:12px;color:var(--ash)}
.att button:hover{border-color:var(--blood);color:var(--blood-hi)}
.wurfbox{border:1px solid var(--gold-dim);background:rgba(217,164,65,.06);padding:9px 10px;font-size:13px}
.wurfbox .erg{font-family:var(--mono);font-size:13.5px;display:block;margin-bottom:7px}
.wurfbox .erg b{color:var(--gold);font-size:16px}
.wurfbox .an{display:flex;gap:5px;flex-wrap:wrap}
.wurfbox .an button{border:1px solid var(--line-hi);padding:4px 9px;font-size:11.5px;color:var(--ash)}
.wurfbox .an button:hover{border-color:var(--blood);color:var(--blood-hi)}
.zufuegen{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.zufuegen button{border:1px dashed var(--line-hi);padding:6px 10px;font-size:12px;color:var(--dim)}
.zufuegen button:hover{border-color:var(--gold-dim);color:var(--gold);border-style:solid}
.wisszeile{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:9px 10px;margin-bottom:6px;width:100%;text-align:left}
.wisszeile:hover{border-color:var(--line-hi)}
.wisszeile.hat{border-color:var(--moss);background:rgba(116,176,148,.07)}
.wisszeile .haken{font-family:var(--mono);font-size:13px;color:var(--dim);flex:none}
.wisszeile.hat .haken{color:var(--moss)}
.wisszeile b{font-weight:400;font-size:14px;display:block}
.wisszeile span{font-size:12px;color:var(--ash);display:block;margin-top:2px}
.wisszeile.hat span{color:var(--moss)}
.leerfach{font-size:12.5px;color:var(--dim);font-style:italic;margin:0}
.chronik{list-style:none;margin:0;padding:0;max-height:180px;overflow-y:auto;font-size:12.5px}
.chronik li{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ash)}
.chronik li .z{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none}
.chronik li b{color:var(--bone);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<header class="krone">
  <div>
    <span class="sub">Dungeon Master · Ein Abend, drei Spieler</span>
    <h1>The Bride of Nachtfels</h1>
  </div>
  <div class="rechts">
    <span class="badge g0" id="kgefahr">Gefahr <b>0</b>/10</span>
    <span class="badge" id="kschritt">Schritt 1/12</span>
    <button class="klein" id="zuruecksetzen">Neue Runde</button>
  </div>
</header>

<nav class="pfad" id="pfad" aria-label="Szenen"></nav>

<div class="raum">
  <main class="szene">
    <div class="szenenkopf">
      <span class="n" id="s-n">Anleitung</span>
      <h2 id="s-titel">…</h2>
      <div class="lage" id="lage"></div>
    </div>
    <div class="bloecke" id="bloecke"></div>
    <div class="blaettern">
      <button id="zurueck"><span>zurück</span><em id="zurueck-t" style="font-style:normal">—</em></button>
      <button id="vor" class="vor"><span>weiter</span><em id="vor-t" style="font-style:normal">—</em></button>
    </div>
  </main>

  <aside class="leiste">
    <section class="fach">
      <span class="label">Gefahrenbarometer</span>
      <div class="baro">
        <div class="saeule" id="saeule"></div>
        <div class="barotext">
          <div><span class="zahl" id="b-zahl">0</span><small> / 10</small></div>
          <div class="stufe" id="b-stufe">—</div>
          <p class="folge" id="b-folge">—</p>
        </div>
      </div>
      <div class="barobtn">
        <button data-gefahr="-1">−1</button>
        <button data-gefahr="1">+1</button>
        <button data-gefahr="2">+2</button>
      </div>
    </section>

    <section class="fach">
      <span class="label">Die Gruppe <button id="vollheilung">alle voll</button></span>
      <div id="gruppe"></div>
    </section>

    <section class="fach">
      <span class="label">Kampf</span>
      <div id="gegner"></div>
      <p class="leerfach" id="gegner-leer">Kein Kampf im Gang.</p>
      <div class="zufuegen" id="zufuegen"></div>
    </section>

    <section class="fach">
      <span class="label">Was die Gruppe weiss</span>
      <div id="wissen"></div>
    </section>

    <section class="fach">
      <span class="label">Chronik</span>
      <ul class="chronik" id="chronik"></ul>
    </section>
  </aside>
</div>

<script>
"use strict";

/* ====================== FESTE DATEN ====================== */
